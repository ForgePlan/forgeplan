# F10 reference task set — 30 tasks over corpus ws-a (drain-queue) + ws-b (billing).
#
# Fields:
#   id                 task id
#   kind               search | get            (pack mode always packs `question`)
#   search_mode        smart | keyword | semantic — local-mode flag (federated/pack ignore it)
#   question           query / pack task text
#   key                artifact id (kind: get)
#   fed_query          optional override for `constellation search`, which is a
#                      literal substring match — must be a verbatim corpus string
#   pack_query         optional override for `constellation pack` task text —
#                      pack ranks by term overlap (e.g. English text for a
#                      Russian `question`, which only semantic local search can serve)
#   expected_sources   which workspaces hold the answer; also drives local-mode fan-out
#   expected_artifacts canonical keys a good answer surfaces (rank + wrong-ref accounting)
#   must_include       substrings the gathered evidence must contain (constraint recall)
#   must_not_include   substrings signalling boundary/version violations
#   expect_found       true | false | ambiguous
#   budget             pack token budget (chars/4 estimate), default 2000

# ─── ws-a only ────────────────────────────────────────────────────────────────

