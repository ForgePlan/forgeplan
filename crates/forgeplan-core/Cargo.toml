[package]
name = "forgeplan-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core library for Forgeplan — artifact types, scoring, validation, storage drivers"
keywords = ["project-management", "decision-records", "methodology", "artifacts"]
categories = ["development-tools"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
regex = "1"
tokio.workspace = true
lancedb.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
futures.workspace = true
async-trait.workspace = true
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
pulldown-cmark = "0.13"
petgraph.workspace = true
fastembed = { version = "5", optional = true }
bm25 = { version = "2.3.2", features = ["language_detection"] }
sha2 = "0.10"
tracing = "0.1"
rand = "0.8"
fs2.workspace = true
schemars.workspace = true
semver.workspace = true
tera.workspace = true
walkdir.workspace = true
globset.workspace = true

[features]
default = []
semantic-search = ["fastembed"]
# Exposes test-only escape hatches (`*_for_test`) on `LanceStore` so
# downstream test fixtures can seed the DB directly without going through
# the projection pipeline they're not exercising. Production code MUST
# NOT enable this feature.
test-helpers = []

[dev-dependencies]
tempfile = "3"
# CR-H6 (audit closure): mark every test that mutates process-global
# PATH / HOME with `#[serial_test::serial(env_path)]` or
# `#[serial_test::serial(env_home)]` so they cannot run in parallel
# inside this crate's test binary. The locks are in-process — cargo
# runs each crate's tests as a separate binary, so the lock in this
# crate does NOT protect against `forgeplan-cli` or `forgeplan-mcp`
# tests running simultaneously. The pragmatic mitigation is to tag
# every PATH/HOME mutator within each crate so intra-crate parallelism
# is safe; cross-crate races are bounded by cargo's default behaviour
# of running one test binary at a time per crate.
serial_test = "3"
# T5 audit closure — captures tracing events in unit tests so we can
# assert that `warn_on_permissive_mode` actually emits its warning when
# secrets.env permissions are too open. Without this, a future refactor
# that silently drops the `tracing::warn!` call would not be caught.
#
# `no-env-filter` feature is REQUIRED because forgeplan emits with custom
# targets (e.g. `target: "forgeplan::secrets"`). The default crate-name
# filter (`forgeplan_core=trace`) would exclude those events; this
# feature substitutes plain `trace` so any target passes through.
tracing-test = { version = "0.2", features = ["no-env-filter"] }
