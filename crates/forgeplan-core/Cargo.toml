[package]
name = "forgeplan-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core library for Forgeplan — artifact types, scoring, validation, storage drivers"
keywords = ["project-management", "decision-records", "methodology", "artifacts"]
categories = ["development-tools"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
regex = "1"
tokio.workspace = true
lancedb.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
futures.workspace = true
async-trait.workspace = true
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
pulldown-cmark = "0.13"
petgraph.workspace = true
# RFC-013: pure-Rust inference. Compiles wherever our binary compiles, which is
# the whole reason for the swap — no prebuilt to match against the build
# environment (EVID-158).
tract-onnx = { version = "0.23", optional = true }
# The same tokenizer library fastembed uses internally, loaded from the same
# tokenizer.json. Matching tokenization exactly is what keeps the vectors
# identical rather than merely similar.
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig"] }
# Model download. fastembed used this internally; with fastembed gone we call
# it directly. `rustls-tls` to match the stack `reqwest` already pulls in —
# a second TLS implementation in one binary is pure weight.
hf-hub = { version = "0.5", optional = true, default-features = false, features = ["ureq"] }
# Model-cache resolution (`embed::resolve_cache_dir`). Only meaningful with
# `semantic-search`, but kept unconditional: the resolver is compiled in both
# feature configs so the first-run notice can name the target directory even
# when the embedder itself is absent.
dirs = "6"
tempfile = "3"
bm25 = { version = "2.3.2", features = ["language_detection"] }
sha2 = "0.11"
# ADR-029 §0 durability seam. The two public injection points the protocol
# is built on are `lance_io::object_store::WrappingObjectStore` (what
# `NativeTable::{create,create_empty,open_with_params}` accepts as
# `write_store_wrapper`) and `object_store::ObjectStore` (what a wrapping
# store must implement to be wrapped). Pinned exactly so the lockfile's
# already-resolved `lance-io 4.0.0` / `object_store 0.12.5` entries are
# reused rather than re-resolved to a different version.
#
# `default-features = false` is **required**, not a preference. lance-io's
# `default = ["aws", "azure", "gcp"]`, and each of those enables
# `dep:opendal` + `dep:object_store_opendal` — which drags in the whole cloud
# SDK stack (aws-config and friends, requiring rustc 1.94.1 against the
# toolchain's 1.91.1) and added 75 packages to the lockfile. `lancedb` 0.27.2
# declares its own `lance-io` with `default-features = false` precisely for
# this reason; this line matches it.
#
# No feature is enabled in place of `default`: `lance_io::object_store` is a
# plain, unconditional `pub mod` (`lance-io-4.0.0/src/lib.rs:17`) and
# `WrappingObjectStore` is declared ungated (`src/object_store.rs:154`), so
# the local `file-object-store` provider and the wrapper trait are reachable
# with the crate's features off. The `file-object-store` registration in
# `src/object_store/providers.rs:300-303` is likewise unconditional.
lance-io = { version = "=4.0.0", default-features = false }
object_store = "=0.12.5"
tracing = "0.1"
rand = "0.9"
fs2.workspace = true
schemars.workspace = true
semver.workspace = true
tera.workspace = true
walkdir.workspace = true
globset.workspace = true

# Audit-r3 M4 closure — O_NOFOLLOW flag for the anomalies-journal
# tempfile open so a pre-created symlink with workspace-write access
# cannot redirect our write to a sibling target.
# v0.32.1 hotfix: ONLY libc is unix-gated. Previously (commit a3b6ed3)
# `tera` / `walkdir` / `globset` were accidentally placed inside this
# block, breaking Windows compilation (cargo-dist v0.32.0 Release
# workflow exited with 20 E0432/E0433 errors). They are cross-platform
# crates used unconditionally in `src/ingest/` and `src/projection/`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ADR-029 §0 `WindowsNtfsDurability`: public Win32 file and namespace
# operations only — `CreateFileW` / `WriteFile` / `FlushFileBuffers` /
# `CreateDirectoryW` / `MoveFileExW`. `Win32_Security` is required for the
# security attributes the file and directory calls take. `Win32_System_IO`
# is required because `WriteFile` is gated behind it in windows-sys 0.61.2.
# `Win32_System_WindowsProgramming` is required for the `DRIVE_*` constants
# that distinguish a local fixed volume from a network mount.
# No administrator rights, no volume flush, no TxF.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming",
] }

[features]
default = []
# Vector search. Since RFC-013 this is the pure-Rust tract engine: it compiles
# wherever our binary compiles, which is what lets the feature ship in the
# release binaries at all (EVID-158 measured the ONNX Runtime path failing on
# four of five targets). `tract-engine` is kept as the concrete name so the
# parity tests can address the engine directly.
semantic-search = ["tract-engine"]
tract-engine = ["tract-onnx", "tokenizers", "hf-hub"]
# Exposes test-only escape hatches (`*_for_test`) on `LanceStore` so
# downstream test fixtures can seed the DB directly without going through
# the projection pipeline they're not exercising. Production code MUST
# NOT enable this feature.
test-helpers = []

[dev-dependencies]
# CR-H6 (audit closure): mark every test that mutates process-global
# PATH / HOME with `#[serial_test::serial(env_path)]` or
# `#[serial_test::serial(env_home)]` so they cannot run in parallel
# inside this crate's test binary. The locks are in-process — cargo
# runs each crate's tests as a separate binary, so the lock in this
# crate does NOT protect against `forgeplan-cli` or `forgeplan-mcp`
# tests running simultaneously. The pragmatic mitigation is to tag
# every PATH/HOME mutator within each crate so intra-crate parallelism
# is safe; cross-crate races are bounded by cargo's default behaviour
# of running one test binary at a time per crate.
serial_test = "3"
# T5 audit closure — captures tracing events in unit tests so we can
# assert that `warn_on_permissive_mode` actually emits its warning when
# secrets.env permissions are too open. Without this, a future refactor
# that silently drops the `tracing::warn!` call would not be caught.
#
# `no-env-filter` feature is REQUIRED because forgeplan emits with custom
# targets (e.g. `target: "forgeplan::secrets"`). The default crate-name
# filter (`forgeplan_core=trace`) would exclude those events; this
# feature substitutes plain `trace` so any target passes through.
tracing-test = { version = "0.2", features = ["no-env-filter"] }
# Property-based testing for invariants that pure unit tests can't easily
# cover. Used by `projection::tests::replace_link_upsert_idempotent_*` to
# fuzz the 7 input shapes (no prior edge, same relation, different
# relation, …) across the upsert state machine. Audit-r2 closure: pure
# unit coverage missed reverse-direction + alternate-relation cases until
# explicitly added; proptest gives a shotgun guard against the next gap.
proptest = "1"

# PROB-074 fix: the lance_stale_refresh_test integration test calls
# `create_artifact_for_test` / `add_relation_for_test` which are
# `#[cfg(any(test, all(feature = "test-helpers", debug_assertions)))]`.
# Integration tests under `tests/` compile as a *separate crate* — they do
# NOT inherit the host crate's `#[cfg(test)]` gate.  Without this target
# entry `cargo test --workspace` (CI baseline, no extra flags) would fail
# with E0599 "no method named `create_artifact_for_test`".
# `required-features` makes cargo skip-compile (and skip-run) the test
# binary when test-helpers is not enabled, keeping the default build clean.
[[test]]
name = "lance_stale_refresh_test"
path = "tests/lance_stale_refresh_test.rs"
required-features = ["test-helpers"]

# Same PROB-074 gate for the remaining targets that call `*_for_test`
# helpers: without `required-features` they fail E0599 under the default
# `cargo test --workspace` / `cargo bench` baseline.
[[test]]
name = "health_verdict_test"
path = "tests/health_verdict_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "integrity_test"
path = "tests/integrity_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "phase_read_errors_e2e_test"
path = "tests/phase_read_errors_e2e_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "scoring_cascade_test"
path = "tests/scoring_cascade_test.rs"
required-features = ["test-helpers"]

# These are `#[test]`-style latency probes (`Instant` + `#[ignore]`, no
# criterion harness) that happen to carry "bench" in the name — declaring
# them [[bench]] would demand a main() they do not have.
[[test]]
name = "create_roundtrip_bench"
path = "tests/create_roundtrip_bench.rs"
required-features = ["test-helpers"]

[[test]]
name = "health_bench"
path = "tests/health_bench.rs"
required-features = ["test-helpers"]
