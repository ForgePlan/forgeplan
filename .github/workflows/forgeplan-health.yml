name: Architecture Health

on:
  pull_request:
    branches: [dev, main]
    paths:
      - '.forgeplan/**'
      - 'crates/**'

jobs:
  health:
    name: Forgeplan Health Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable branch @ 2026-03-27 (no tag; verify with git ls-remote)

      - name: Rust compilation cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Build forgeplan
        run: cargo build -p forgeplan

      - name: Rebuild index from tracked markdown
        run: |
          # `lance/` is gitignored (ADR-003 — markdown is source of truth),
          # so checkout has no LanceDB index. `forgeplan reindex` rebuilds
          # the index from `.forgeplan/<kind>/*.md` files.
          #
          # Earlier this step used `mv .forgeplan .forgeplan-src && init -y
          # && cp -r .forgeplan-src/{kind}/ .forgeplan/`. That was broken
          # two ways:
          #   1. `cp -r src/ dst/` with trailing slash flat-copies CONTENTS
          #      into dst, so every kind's `.md` ended up in `.forgeplan/`
          #      root with the proper `prds/`, `adrs/` etc. left empty.
          #      scan-import then found 0 in the real kind dirs and instead
          #      picked up templates/sources/ noise (15 phantom artifacts).
          #   2. The hard-coded kind list never grew with Epic #287's
          #      brownfield kinds (use_cases/glossary/invariants/scenarios/
          #      hypotheses/domain_models) — those were silently dropped.
          # Tracked as PROB-068 (init/scan-import lossy round-trip).
          ./target/debug/forgeplan reindex

      - name: Health check
        run: ./target/debug/forgeplan health --ci --fail-on "orphans=10,blind_spots=5"

      - name: Validate artifacts
        run: ./target/debug/forgeplan validate --ci

      # The MCP tool-count drift check moved to ci.yml (job
      # check-mcp-tool-count-drift). #421: this workflow only triggers on
      # paths .forgeplan/** and crates/**, but the drift it guards lives in
      # website/**, docs/**, CLAUDE.md, README.md and TODO.md — a docs-only PR
      # never ran the detector here, which is exactly how the stale '63' in a
      # RU page survived. ci.yml runs on every PR with no path filter.
