# Security CI — cargo-deny gate
#
# Runs cargo-deny on push to dev/main and a weekly cron schedule. Does NOT run
# on pull_request (see ADR-013 for rationale). CVE findings are discovered
# post-merge on the dev branch, allowing honest CI signal (PRs do not show a
# false "security ✓" badge) and reduced friction on dependabot updates.
#
# Timing: push events land immediately; weekly cron on Monday 07:23 UTC catches
# new advisories within ~7 days. Release time gate (push to main) ensures the
# production branch is scanned before release.
#
# PR baseline cleaned in Wave 8B (chore/cargo-deny-baseline): license allow
# list extended for 0BSD / BSL-1.0 + scoped CDLA exception for webpki-roots;
# transitive duplicates from arrow/datafusion/lance/tantivy documented in
# [[bans.skip]].
#
# Config: deny.toml at repo root.
# Policy: ADR-013 (CI Security Gate Policy).
# Dependabot triage: RED LINE #10 (CLAUDE.md).

name: security

on:
  push:
    branches: [dev, main]
  schedule:
    # Weekly scan to catch advisories that land between commits (e.g. new
    # RUSTSEC disclosures against pinned versions). Runs Monday 07:23 UTC.
    - cron: "23 7 * * 1"
  # Manual escape hatch — ADR-013 §FAQ Q1 promises a one-click GitHub UI
  # trigger as the same-day recovery path when a CVE drops between cron runs.
  # Without `workflow_dispatch` here the "Run workflow" button is absent.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny check
    runs-on: ubuntu-latest
    # ADR-013 picked "honest CI signal" — do NOT add `continue-on-error: true`
    # here; that suppresses the job exit and makes the security badge green
    # even when cargo-deny reports a real advisory failure.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          command: check advisories licenses bans sources
          log-level: warn
