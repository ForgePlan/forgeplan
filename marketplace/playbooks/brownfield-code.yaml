# =====================================================================
# brownfield-code.yaml — Canonical playbook: legacy code repo onboarding
# =====================================================================
#
# Target applicability: ForgeplanCore steps require the legacy artifacts/
# evidence/relations tables. Do not recreate retired tables to make this
# reference run on a Constellation workspace; use a separately scoped fixture.
#
# Purpose:
#   Bring a code-only brownfield repository (50+ commits, no docs) into
#   Forgeplan's structured world by orchestrating C4 architecture
#   extraction and ingestion of those docs as forge Notes. The history-mining
#   and summary-linking portions describe intent, not completed automation.
#   EPIC-007 in the mapping is an illustrative pre-existing target.
#
# When to run:
#   `forgeplan playbook run brownfield-code --yes`
#   (typically suggested by `forgeplan init` when the repo has git
#   history, no docs/, and no .obsidian/ — see PRD-067 FR-5).
#
# References:
#   - SPEC-003 — Playbook YAML schema
#   - PRD-065 — Playbook runtime
#   - PRD-067 — Plugin detection + recommendation
#   - PRD-068 — forge-history-miner skill
#   - ADR-009 — Forgeplan as orchestrator
#   - marketplace/mappings/c4-to-forge.yaml — companion mapping
# =====================================================================

schema_version: "1.0"
name: brownfield-code
title: "Brownfield code-first onboarding"
description: |
  Reference four-step flow: run C4 → ingest C4 → request history mining →
  create a summary Note template. Ingest drafts retain the ADR-009
  `## Sources` invariant. See the companion mapping's applicability warning:
  its semantic section fields require a matching source contract.

  The C4 step needs the installed plugin. In this target, SkillDispatcher
  only emits an invocation trace and returns the declared output path; it
  neither checks skill installation nor runs the history miner. The final
  `new` op accepts kind/title only: it does not fill a summary, apply the
  input tags, or link imported artifacts. Operators must perform those tasks.

# ---------------------------------------------------------------------
# Recommendation engine signals (PRD-067 FR-5)
# Higher specificity = better match. Forge `init` matches against the
# detected project state and ranks playbooks accordingly.
# ---------------------------------------------------------------------
triggered_by:
  has_git: true
  commit_count_min: 50
  has_docs: false
  has_obsidian: false

# ---------------------------------------------------------------------
# Prerequisites — surfaced via `forgeplan plugins doctor` + step
# fallback_hint when missing at runtime.
# ---------------------------------------------------------------------
requires:
  plugins:
    - name: c4-architecture
      version: ">=1.0"
  skills:
    - name: forge-history-miner
      pack: brownfield-code-pack

# ---------------------------------------------------------------------
# Steps — DAG ordering via `requires:` (step IDs only, never freeform)
#
# Phase 6 BUG-3 (real-world testing 2026-04-28):
#   The original v1 of this playbook started with a `detect-c4-need`
#   step delegating to `forgeplan_core: validate`. That delegation
#   requires `step.input.id` (it validates a specific artifact) —
#   semantically there is no artifact yet at this point in the flow,
#   so the step always failed with `Validate input missing 'id'` and
#   aborted the whole playbook. v2 drops the detect preamble; the
#   triggered_by recommendation engine (PRD-067 FR-5) already gates
#   when this playbook is suggested by `forgeplan init`, which is the
#   appropriate place for that decision.
# ---------------------------------------------------------------------
steps:

  # 1. Run C4 architecture extraction — produces C4-Documentation/.
  #    The c4-architecture plugin must be installed; if missing, the
  #    DelegateMissing error surfaces the `fallback_hint` install
  #    command and the step's `on_error: abort` policy stops the run
  #    cleanly before ingest fires on an empty directory.
  - id: run-c4-architecture
    delegate_to:
      type: plugin
      name: c4-architecture
      target: c4-code
    input:
      scope: full-repo
    produces_at: "C4-Documentation/"
    fallback_hint: "claude plugin install c4-architecture"
    on_error: abort

  # 2. Ingest the C4 output into forge Notes via the canonical mapping.
  #
  #    Track 4-A8 R1 audit (code-review C-1): `ForgeplanCoreDispatcher::Ingest`
  #    contract requires `step.input.mapping_path` + `step.input.source_path`
  #    (parse_op_input in forgeplan_core_dispatcher.rs). Top-level `mapping:`
  #    is a SOFT WARNING field in `loader.rs` — never read by the
  #    dispatcher. Pre-fix this step shipped with `mapping: c4-to-forge` at
  #    top level + no `step.input` and was non-functional end-to-end since
  #    Phase 6; the broken shape was copied into early drafts of
  #    `brownfield-docs.yaml` and caught by the new
  #    `marketplace_playbooks_smoke.rs` regression guard added in the
  #    Track 4-A8 PR. Fix shape inline here for parity.
  - id: ingest-c4
    delegate_to:
      type: forgeplan_core
      target: ingest
    input:
      mapping_path: "marketplace/mappings/c4-to-forge.yaml"
      source_path: "C4-Documentation/"
    requires: [run-c4-architecture]
    on_error: abort

  # 3. Request history mining (reference intent).
  #    Current SkillDispatcher emits a trace only; it does not create
  #    inferred-adrs.md or validate the install hint below.
  - id: run-history-miner
    delegate_to:
      type: skill
      name: forge-history-miner
      pack: brownfield-code-pack
    input:
      since: "12.months.ago"
    produces_at: ".forgeplan/notes/inferred-adrs.md"
    requires: [ingest-c4]
    fallback_hint: "forgeplan skill install brownfield-code-pack"
    on_error: continue

  # 4. Create a summary Note template, not a populated or linked summary.
  #    Current `new` ignores input.tags; author and link the Note separately.
  - id: summary-note
    delegate_to:
      type: forgeplan_core
      target: new
    input:
      kind: note
      title: "Brownfield onboarding summary"
      tags: ["brownfield", "auto-import"]
    requires: [run-history-miner]
    on_error: abort
