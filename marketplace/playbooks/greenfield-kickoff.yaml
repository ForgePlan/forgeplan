# =====================================================================
# greenfield-kickoff.yaml — Canonical playbook: empty repo bootstrap
# =====================================================================
#
# Target applicability: ForgeplanCore steps still open the legacy artifacts/
# evidence/relations tables. The current `new` dispatcher is not proof of
# compatibility with a Constellation-only workspace; do not restore retired tables.
#
# Purpose:
#   Take a brand-new project (empty repo or just `git init`-ed) from
#   "no artifacts at all" to a structured Forgeplan workspace with a
#   Note, stack ADR, Epic and three PRD templates through the in-process
#   ForgeplanCore dispatcher, with no external plugin/agent dependency for
#   those creates. These are drafts to fill, not captured decisions.
#   The optional skill step currently emits a trace only; it does not
#   scaffold docs or check whether forge-scaffolder is installed.
#
# When to run:
#   `forgeplan playbook run greenfield-kickoff --yes`
#   Recommended by `forgeplan init` on an empty repo (PRD-067 FR-5,
#   PRD-072 FR-6 / AC-3) — surfaced by the recommendation engine when
#   `triggered_by` matches the detected project state below.
#
# Duration is environment-dependent; six in-process template creates do not
# establish that the requested skill work ran.
#
# Where it fits in ForgePlan:
#   This is the canonical "Shape" entry point of the methodology
#   loop (Shape → Validate → Code → Evidence → Activate). After this
#   playbook completes, the user has the minimum scaffold required to
#   start filling in PRD MUST sections and progress towards
#   `forgeplan validate` passing.
#
# References:
#   - PRD-072 FR-7 + AC-7 + AC-8 — this playbook closes those.
#   - SPEC-003 — Playbook YAML schema (this file is schema_version 1.0).
#   - RFC-007 §"Greenfield playbook" — design rationale.
#   - marketplace/playbooks/brownfield-code.yaml — companion playbook.
# =====================================================================

schema_version: "1.0"
name: greenfield-kickoff
title: "Greenfield project bootstrap"
description: |
  Create six draft templates through ForgeplanCore:
    1. Project-vision Note
    2. Initial-stack ADR
    3. Kickoff Epic
    4. Three feature PRDs
    5. Request docs scaffolding (trace-only skill step in this target)

  `requires` orders execution; it does not create artifact parent links.
  Fill the drafts immediately, select actual decisions, add their links and
  validate before coding. No PRD is complete merely because this run succeeds.
  SkillDispatcher neither invokes forge-scaffolder nor checks installation.

# ---------------------------------------------------------------------
# Recommendation engine signals (PRD-067 FR-5)
# Match: empty/just-initialised git repo with no prior commits.
# ---------------------------------------------------------------------
triggered_by:
  empty_repo: true
  has_git: true

# ---------------------------------------------------------------------
# Prerequisites — no external plugins for the six core creates.
# The optional skill declaration is reference intent; current SkillDispatcher
# emits a trace without verifying installation or displaying fallback_hint.
# ---------------------------------------------------------------------
requires:
  plugins: []
  skills:
    - name: forge-scaffolder
      pack: brownfield-docs-pack

# ---------------------------------------------------------------------
# Steps — strict DAG via `requires:` (step IDs only, never freeform).
# This example uses the backward-compatible 1.0 shape; the current Step type
# also supports timeout_seconds (1.1) and budget/tool fields (1.2).
# ---------------------------------------------------------------------
steps:

  # 1. Capture project vision as a Note. First step — no requires.
  #    Notes have minimal MUST rules and skip the validation gate, so
  #    this is a safe quick-write to anchor the rest of the playbook.
  - id: capture-vision
    delegate_to:
      type: forgeplan_core
      target: new
    input:
      kind: note
      title: "Project vision capture"
    on_error: abort

  # 2. Record the initial stack decision as an ADR draft. Sequential
  #    after vision so the author can reference the captured vision
  #    while filling in alternatives + consequences.
  - id: stack-decision
    delegate_to:
      type: forgeplan_core
      target: new
    input:
      kind: adr
      title: "Initial stack decision"
    requires: [capture-vision]
    on_error: abort

  # 3. Create the kickoff Epic template. No parent links are created by `new`;
  #    author its Children table and actual graph links separately.
  - id: kickoff-epic
    delegate_to:
      type: forgeplan_core
      target: new
    input:
      kind: epic
      title: "Project initial scope"
    requires: [stack-decision]
    on_error: abort

  # 4-6. Three feature PRD templates ordered after kickoff-epic.
  #      The executor is sequential; `requires` is a step dependency,
  #      not an artifact parent relation. Fill and link the resulting drafts.
  - id: prd-feature-1
    delegate_to:
      type: forgeplan_core
      target: new
    input:
      kind: prd
      title: "First feature PRD"
    requires: [kickoff-epic]
    on_error: abort

  - id: prd-feature-2
    delegate_to:
      type: forgeplan_core
      target: new
    input:
      kind: prd
      title: "Second feature PRD"
    requires: [kickoff-epic]
    on_error: abort

  - id: prd-feature-3
    delegate_to:
      type: forgeplan_core
      target: new
    input:
      kind: prd
      title: "Third feature PRD"
    requires: [kickoff-epic]
    on_error: abort

  # 7. Optional scaffolding request, not an executed scaffold in this target.
  #    on_error: continue permits later steps after failure, but a failed or
  #    skipped step still makes ExecutionReport::ok() false. A trace success
  #    also does not prove any docs were written.
  - id: scaffold-docs
    delegate_to:
      type: skill
      name: forge-scaffolder
      pack: brownfield-docs-pack
    requires: [kickoff-epic]
    fallback_hint: "claude skill install ForgePlan/forge-scaffolder"
    on_error: continue
