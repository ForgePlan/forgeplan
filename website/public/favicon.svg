<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Wireframe cube favicon">
  <style>
    :root {
      --bg: #f6f1ea;
      --dot: #d8d0c6;
      --stroke: #d94f1f;
      --hidden: 0.35;
      --circle: #ff5a1f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0d;
        --dot: #2e2e2e;
        --stroke: #ff5a1f;
        --hidden: 0.38;
        --circle: #ff5a1f;
      }
    }
  </style>
  <rect width="256" height="256" fill="var(--bg)"/>
  <defs>
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="var(--dot)"/>
    </pattern>
  </defs>
  <rect width="256" height="256" fill="url(#dot-grid)"/>
  <g fill="none" stroke="var(--stroke)" stroke-linecap="round" stroke-linejoin="round" shape-rendering="geometricPrecision">
    <path d="M128 21 L225 75 L225 181 L128 235 L31 181 L31 75 Z" stroke-width="2.1"/>
    <path d="M31 75 L128 130 L225 75" stroke-width="1.65" opacity="0.62"/>
    <path d="M128 130 L128 235" stroke-width="1.65" opacity="0.62"/>
    <path d="M128 21 L128 130" stroke-width="1.4" stroke-dasharray="4 8" opacity="var(--hidden)"/>
    <path d="M31 181 L128 130" stroke-width="1.4" stroke-dasharray="4 8" opacity="var(--hidden)"/>
    <path d="M225 181 L128 130" stroke-width="1.4" stroke-dasharray="4 8" opacity="var(--hidden)"/>
  </g>
  <circle cx="128" cy="130" r="18.5" fill="var(--circle)"/>
</svg>
